name: Build OBSViewer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish (if not already published) the release for the version in buildspec.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Layout, version and updater logic tests (with sanitizers)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -Wall -Wextra -Werror -Isrc \
            tests/UnitTests.cpp src/core/Version.cpp src/viewer/Layouts.cpp src/update/ReleaseInfo.cpp src/core/Health.cpp \
            -o unit_tests
          ./unit_tests

  macos:
    name: macOS universal (arm64 + x86_64)
    needs: tests
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (OBS 32.2 needs the macOS 26.5 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [[ -n "$XCODE" ]]; then sudo xcode-select --switch "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-platform-version

      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # The tag decides the version baked into the plugin and installer.
            jq --arg v "$VERSION" '.version = $v' buildspec.json > buildspec.tmp && mv buildspec.tmp buildspec.json
          else
            VERSION="$(jq -r .version buildspec.json)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building OBSViewer $VERSION"

      - name: Cache OBS dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: macos-deps-${{ hashFiles('buildspec.json', 'cmake/common/buildspec_common.cmake') }}
          restore-keys: macos-deps-

      - name: Configure
        run: |
          status=0
          cmake --preset macos-ci > configure.log 2>&1 || status=$?
          tail -n 40 configure.log
          if (( status != 0 )); then .github/scripts/annotate-log.sh configure.log "Configure failed"; fi
          exit $status

      - name: Build
        run: |
          status=0
          cmake --build build_macos --config Release --parallel > build.log 2>&1 || status=$?
          grep -E "error:|warning: |\*\* BUILD" build.log | sort -u | head -200 || true
          if (( status != 0 )); then .github/scripts/annotate-log.sh build.log "Build failed"; fi
          # Surface compiler warnings from OBSViewer's own sources in the run summary.
          grep -E "/src/.*warning: " build.log | grep -v "/.deps/" | sed -E 's#^.*/src/#src/#' | sort -u | head -10 \
            | while IFS= read -r w; do echo "::warning title=Compiler warning::$w"; done || true
          exit $status

      - name: Install and create the installer package
        run: |
          status=0
          cmake --install build_macos --config Release --prefix "$PWD/release/Release" > install.log 2>&1 || status=$?
          tail -n 30 install.log
          if (( status != 0 )); then .github/scripts/annotate-log.sh install.log "Packaging failed"; fi
          exit $status

      - name: Check the plugin
        run: |
          BIN="release/Release/obsviewer.plugin/Contents/MacOS/obsviewer"
          file "$BIN"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64
          lipo -archs "$BIN" | grep -q x86_64
          HELPER="release/Release/obsviewer.plugin/Contents/Helpers/obsviewer-scan"
          lipo -archs "$HELPER" | grep -q arm64
          lipo -archs "$HELPER" | grep -q x86_64
          codesign -d --entitlements - "$HELPER"
          codesign --verify --verbose=2 release/Release/obsviewer.plugin
          otool -L "$BIN"

      - name: Name the installer
        id: package
        run: |
          PKG="OBSViewer-${{ steps.version.outputs.version }}-macos-universal.pkg"
          mkdir -p dist
          mv release/Release/obsviewer.pkg "dist/$PKG"
          pkgutil --payload-files "dist/$PKG" | head -40
          (cd dist && shasum -a 256 "$PKG" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OBSViewer-macos-universal
          path: dist/*

  release:
    name: Publish release
    needs: macos
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OBSViewer-macos-universal
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r .version buildspec.json)"
          fi
          TAG="v$VERSION"

          # 1. A numbered release for every new version. This is what the in-plugin
          #    updater offers, so bumping "version" in buildspec.json on main is all
          #    it takes to ship an update.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published; leaving it as it is."
          else
            awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found=1; next } }
              found { print }
            ' CHANGELOG.md > notes.md || true
            if [[ ! -s notes.md ]]; then echo "OBSViewer $VERSION" > notes.md; fi
            if [[ "$VERSION" == *-* ]]; then
              gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OBSViewer $VERSION" --notes-file notes.md --prerelease
            else
              gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OBSViewer $VERSION" --notes-file notes.md --latest
            fi
            echo "Published $TAG"
          fi

          # 2. The rolling "Latest build (main)" test build, refreshed on every push to main.
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            gh release delete latest --cleanup-tag --yes 2>/dev/null || true
            gh release create latest dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Latest build (main)" \
              --notes "Newest build from main (${GITHUB_SHA::7}), version $VERSION. macOS universal (Apple Silicon + Intel) installer. Numbered releases (v$VERSION etc.) are what the in-plugin updater offers."
          fi
